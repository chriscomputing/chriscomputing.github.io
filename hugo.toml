baseURL = 'https://blog.chriscomputing.de/'
title = ''

# --- Theme Options --- #
theme = "hugo-bearcub"
copyright= "chriscomputing (CC BY-NC-SA 4.0)"
defaultContentLanguage = "en"
enableRobotsTXT = true  # Für die coole SEO

# Markup Setup
[markup]
    [markup.highlight]
    lineNos = true
    lineNumbersInTable = false
    # This allows Bear Cub to use a variation of Dracula that is more accessible
    # to people with poor eyesight. For more information about color contrast
    # and accessibility, see https://web.dev/color-and-contrast-accessibility/
    noClasses = false

  [markup.goldmark]
    [markup.goldmark.extensions]
      footnote = true
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$']]
          inline = [['$', '$']]
  
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

# Theme Language Setup
[languages]
    [languages.de]
    title = "chriscomputing.com"
    label = "Deutsch 🇩🇪"
    locale = 'de-DE'
    contentDir = "content.de"
    [languages.de.params]
        madeWith = "Gemacht mit meinem eigenen [Bear Cub fork](https://github.com/chriscomputing/hugo-bearcub)"
        dateFormat = "02.01.2006"
        privacyNotice = "[Datenschutzerklärung](https://blog.chriscomputing.de/datenschutz/)"

    [languages.en]
    title = "chriscomputing.com"
    label = "English 🇬🇧"
    locale = 'en-EN'
    contentDir = "content"
    [languages.en.params]
        madeWith = "Made with my custom [Bear Cub fork](https://github.com/chriscomputing/hugo-bearcub)"
        dateFormat = "2006-01-02"
        privacyNotice = "[Privacy Notice](https://blog.chriscomputing.de/en/privacynotice)"

# Theme parameters
[params]
    hideUntranslated = false
    math = false
    toc_open = true
    # Render the blog index as image cards instead of a plain post list
    cardList = true

    [params.author]
        name = "chriscomputing"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[module]
  [[module.imports]]
    path = 'github.com/hugomods/images'

